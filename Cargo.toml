[workspace]
members = ["app", "stats", "tuner", "meanstats"]

[package]
name = "jixel"
version = "0.5.2"
edition = "2024"
description = "JPEG XL encoder"
readme = "README.md"
keywords = ["jpegxl", "jxl", "encoder", "image", "compression"]
license = "BSD-3-Clause OR Apache-2.0"
authors = ["Radzivon Bartoshyk"]
documentation = "https://docs.rs/jixel"
categories = ["multimedia::images", "compression", "encoding"]
repository = "https://github.com/awxkee/jixel"
exclude = ["*.jpg", "/assets", "*.png", "*.sh", "/assets/*", "/scripts/*", "/tools/*", "parameters_fit/*", ".github/*"]
rust-version = "1.94.0"

[features]
default = ["avx", "neon", "sse", "wasm", "splines", "extraslow"]
avx = []
neon = []
sse = []
wasm = []
splines = []
extraslow = ["dep:cvvdp-lite", "dep:ssimu2-lite"]

[dependencies]
cvvdp-lite = { version = "0.1.1", optional = true }
ssimu2-lite = { version = "0.1.1", optional = true }

[profile.profiling]
inherits = "release"
debug = "full"
